<!DOCTYPE HTML>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E00L9PT3V9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-E00L9PT3V9');
  </script>
  <title>{{ site.name }}</title>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="author" content="{{ site.name }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at center, rgba(255, 182, 193, 0.1) 0%, rgba(255, 255, 255, 1) 70%);
      min-height: 100vh;
      color: #2c1810;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 60px;
      border-bottom: 1px solid #e9ecef;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #d63384;
      text-decoration: none;
    }

    .nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav a {
      color: #d63384;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .nav a:hover {
      color: #a0285a;
    }

    .theme-toggle {
      background: none;
      border: none;
      color: #d63384;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .theme-toggle:hover {
      background-color: rgba(214, 51, 132, 0.1);
    }

    /* Main Content */
    .main-content {
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .name {
      font-size: 4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2c1810 0%, #6b4423 50%, #2c1810 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 20px 0;
      line-height: 1.1;
      /* Fallback for browsers that don't support background-clip */
      color: #2c1810;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #495057;
      margin: 0 0 40px 0;
      font-weight: 400;
    }

    .tags {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 0;
      flex-wrap: wrap;
    }

    .tag {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(255, 182, 193, 0.3);
      color: #2c1810;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .tag:hover {
      background-color: rgba(255, 182, 193, 0.5);
      transform: translateY(-2px);
    }

    .tag-icon {
      font-size: 16px;
    }

    .cta-button {
      background-color: #d63384;
      color: white;
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 40px;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      background-color: #a0285a;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(214, 51, 132, 0.3);
    }

    .cta-button::after {
      content: '→';
      font-size: 20px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 20px;
        margin-bottom: 40px;
      }

      .nav {
        gap: 20px;
      }

      .name {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .tags {
        gap: 15px;
      }

      .tag {
        padding: 10px 16px;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      }

      .name {
        font-size: 2rem;
      }

      .tags {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <a href="/" class="logo">{{ site.name }}</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/#projects">Projects</a>
        <a href="/#skills">Skills</a>
        <a href="/#research">Research</a>
        <a href="/#contact">Contact</a>
        <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <h1 class="name">Isabel Michel</h1>
      <p class="subtitle">Software Engineer | AR/VR Developer | Researcher</p>
      
      <div class="tags">
        <div class="tag">
          <span class="tag-icon">&lt;/&gt;</span>
          <span>Engineering</span>
        </div>
        <div class="tag">
          <span class="tag-icon">🎤</span>
          <span>Research</span>
        </div>
        <div class="tag">
          <span class="tag-icon">✨</span>
          <span>Creating</span>
        </div>
      </div>

      <a href="/#projects" class="cta-button">Explore My Work</a>
    </main>
  </div>

  <script>
    function toggleTheme() {
      // Simple theme toggle functionality
      document.body.classList.toggle('dark-theme');
    }
  </script>
</body>

</html>
